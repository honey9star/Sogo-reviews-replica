<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOGO REVIEWS - Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <!-- Left Banner with Luxury Background -->
    <div class="auth-banner">
      <div class="auth-banner-content">
        <h1 class="auth-brand">SOGO REVIEWS</h1>
        <p class="auth-tagline">GET PAID FOR YOUR OPINION.</p>
      </div>
    </div>

    <!-- Right Form Wrapper -->
    <div class="auth-form-wrapper">
      <div class="form-inner-container">
        <a href="index.html" class="back-home-btn">
          <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          BACK TO HOME
        </a>

        <div class="mobile-brand-title">SOGO REVIEWS</div>

        <!-- LOGIN FORM -->
        <div id="loginFormCard" class="form-card active">
          <div class="form-header">
            <h2>WELCOME BACK</h2>
            <p>Enter your details to access your account</p>
          </div>
          <form onsubmit="event.preventDefault(); window.location.href='client-dashboard.html';">
            <div class="input-group">
              <label>Email or phone</label>
              <input type="text" placeholder="kami_12@gmail.com" required>
            </div>
            <div class="input-group">
              <div class="label-row"><label>Password</label><a href="#" class="forgot-link">Forgot password?</a></div>
              <div class="password-wrap">
                <input type="password" id="loginPass" required>
                <button type="button" class="eye-btn" onclick="togglePassword('loginPass', this)">👁</button>
              </div>
            </div>
            <button type="submit" class="btn-submit">SIGN IN</button>
            
            <!-- Google Sign In Button -->
            <button type="button" class="btn-google" onclick="window.location.href='client-dashboard.html'">
              <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.15 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.18C.43 8.13 0 9.87 0 11.76s.43 3.63 1.18 5.15l4.09-3.17z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.68 1.18 6.61l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
              Continue with Google
            </button>

            <div class="form-switch-text">Don't have an account? <a href="#" onclick="switchTab('signup')">Sign up</a></div>
          </form>
        </div>

        <!-- SIGNUP FORM -->
        <div id="signupFormCard" class="form-card">
          <div class="form-header">
            <h2>CREATE ACCOUNT</h2>
            <p>Join with an invitation code and start earning</p>
          </div>
          <form onsubmit="event.preventDefault(); window.location.href='client-dashboard.html';">
            <div class="input-group"><label>Full name</label><input type="text" placeholder="Your name" required></div>
            <div class="input-group"><label>Email or phone</label><input type="text" placeholder="email or phone number" required></div>
            <div class="input-group">
              <label>Password</label>
              <div class="password-wrap">
                <input type="password" id="signupPass" required>
                <button type="button" class="eye-btn" onclick="togglePassword('signupPass', this)">👁</button>
              </div>
            </div>
            <div class="input-group"><label>Invitation code</label><input type="text" value="Y66C6U2J" required></div>
            <button type="submit" class="btn-submit">SIGN UP</button>
            
            <!-- Google Sign Up Button -->
            <button type="button" class="btn-google" onclick="window.location.href='client-dashboard.html'">
              <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.15 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.18C.43 8.13 0 9.87 0 11.76s.43 3.63 1.18 5.15l4.09-3.17z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.68 1.18 6.61l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
              Continue with Google
            </button>

            <div class="form-switch-text">Already have an account? <a href="#" onclick="switchTab('login')">Sign in</a></div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      const loginCard = document.getElementById('loginFormCard');
      const signupCard = document.getElementById('signupFormCard');
      if(tab === 'signup') {
        loginCard.classList.remove('active');
        signupCard.classList.add('active');
      } else {
        signupCard.classList.remove('active');
        loginCard.classList.add('active');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function togglePassword(fieldId, btn) {
      const input = document.getElementById(fieldId);
      input.type = input.type === "password" ? "text" : "password";
    }
  </script>
</body>
</html>
