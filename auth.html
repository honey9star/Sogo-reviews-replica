<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOGO REVIEWS - Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <script src="auth.js"></script>
</head>
<body class="auth-body">

  <div class="auth-container">
    <!-- Left Banner with Luxury Background -->
    <div class="auth-banner">
      <div class="auth-banner-content">
        <h1 class="auth-brand">SOGO REVIEWS</h1>
        <p class="auth-tagline">GET PAID FOR YOUR OPINION.</p>
      </div>
    </div>

    <!-- Right Form Wrapper -->
    <div class="auth-form-wrapper">
      <div class="form-inner-container">
        <a href="index.html" class="back-home-btn">
          <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          BACK TO HOME
        </a>

        <div class="mobile-brand-title">SOGO REVIEWS</div>

        <!-- LOGIN FORM -->
        <div id="loginFormCard" class="form-card active">
          <div class="form-header">
            <h2>WELCOME BACK</h2>
            <p>Enter your details to access your account</p>
          </div>
          <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
              <label>Email or phone</label>
              <input type="text" id="loginEmail" placeholder="you@example.com" required>
            </div>
            <div class="input-group">
              <div class="label-row"><label>Password</label><a href="#" class="forgot-link">Forgot password?</a></div>
              <div class="password-wrap">
                <input type="password" id="loginPass" required>
                <button type="button" class="eye-btn" onclick="togglePassword('loginPass', this)">👁</button>
              </div>
            </div>
            <p id="loginError" class="form-error" style="display:none;"></p>
            <button type="submit" class="btn-submit">SIGN IN</button>

            <div class="form-switch-text">Don't have an account? <a href="#" onclick="switchTab('signup')">Sign up</a></div>
          </form>
        </div>

        <!-- SIGNUP FORM -->
        <div id="signupFormCard" class="form-card">
          <div class="form-header">
            <h2>CREATE ACCOUNT</h2>
            <p>Join with an invitation code and start earning</p>
          </div>
          <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="input-group"><label>Full name</label><input type="text" id="signupName" placeholder="Your name" required></div>
            <div class="input-group"><label>Email or phone</label><input type="text" id="signupEmail" placeholder="email or phone number" required></div>
            <div class="input-group">
              <label>Password</label>
              <div class="password-wrap">
                <input type="password" id="signupPass" required>
                <button type="button" class="eye-btn" onclick="togglePassword('signupPass', this)">👁</button>
              </div>
            </div>
            <div class="input-group"><label>Invitation code</label><input type="text" id="signupInvite" placeholder="Enter invitation code"></div>
            <p id="signupError" class="form-error" style="display:none;"></p>
            <button type="submit" class="btn-submit">SIGN UP</button>

            <div class="form-switch-text">Already have an account? <a href="#" onclick="switchTab('login')">Sign in</a></div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      const loginCard = document.getElementById('loginFormCard');
      const signupCard = document.getElementById('signupFormCard');
      if(tab === 'signup') {
        loginCard.classList.remove('active');
        signupCard.classList.add('active');
      } else {
        signupCard.classList.remove('active');
        loginCard.classList.add('active');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function togglePassword(fieldId, btn) {
      const input = document.getElementById(fieldId);
      input.type = input.type === "password" ? "text" : "password";
    }

    // Already logged in? Skip straight to the right dashboard.
    (function () {
      const session = SogoAuth.getSession();
      if (session) SogoAuth.redirectForRole(session.role);
    })();

    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPass').value;
      const errorEl = document.getElementById('loginError');

      const result = SogoAuth.login(email, password);
      if (!result.ok) {
        errorEl.textContent = result.message;
        errorEl.style.display = 'block';
        return;
      }
      errorEl.style.display = 'none';
      SogoAuth.redirectForRole(result.user.role);
    }

    function handleSignup(event) {
      event.preventDefault();
      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPass').value;
      const invitationCode = document.getElementById('signupInvite').value;
      const errorEl = document.getElementById('signupError');

      const result = SogoAuth.signup({ name, email, password, invitationCode });
      if (!result.ok) {
        errorEl.textContent = result.message;
        errorEl.style.display = 'block';
        return;
      }
      errorEl.style.display = 'none';
      SogoAuth.redirectForRole(result.user.role);
    }
  </script>
</body>
</html>
